<!doctype html>
<html lang="{{ $.Site.LanguageCode }}">
	{{- partial "head.html" . -}}
	<body a="{{ $.Site.Params.themeConfig.appearance | default " auto" }}">
		<main class="page-content" aria-label="Content">
			<div class="w">
				{{- partial "header.html" . -}}
				{{- block "main" . }}{{- end }}
			</div>
			{{ partial "footer.html" . }}
		</main>
		{{ partial "custom_js.html" . }}
	</body>
</html>
